services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: default
      POSTGRES_PASSWORD: default
      POSTGRES_DB: test
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [my_network]

volumes:
  db_data: {}
networks:
  my_network: {}
